name: Schema conformance

'on':
  push:
    paths:
      - '.github/workflows/conformance.yml'
      - 'schema/**'
      - 'scripts/check-schema-conformance.py'
      - 'tests/fixtures/**'
  pull_request:
    paths:
      - '.github/workflows/conformance.yml'
      - 'schema/**'
      - 'scripts/check-schema-conformance.py'
      - 'tests/fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML

      - name: Download pinned Open Workflow schema
        run: |
          upstream_url="$(python -c "import yaml; print(yaml.safe_load(open('schema/open-workflow-1.0.3.provenance.yaml'))['rawSchema'])")"
          curl --fail --location --silent --show-error "$upstream_url" --output /tmp/open-workflow-1.0.3.yaml

      - name: Validate Agentic superset conformance
        run: ./scripts/check-schema-conformance.py --upstream /tmp/open-workflow-1.0.3.yaml
